name: Build (Windows)

on:
  push:
    branches: [ "master", "main", "sow/**" ]
  pull_request:
    branches: [ "master", "main", "sow/**" ]
  workflow_dispatch:

jobs:
  build:
    # Guard: if this ever gets merged upstream, it will "skip" there.
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    env:
      MSBUILDDISABLENODEREUSE: "1"
      # The native OCCT layer (vcpkg/OpenCASCADE) is not available on the runner,
      # so skip build-native.ps1 and build the managed assemblies only. Integration
      # tests gracefully skip without the native library.
      SAM_OCCT_SKIP_NATIVE_BUILD: "true"

    steps:
      # Checkout THIS repo into a folder so we can clone sibling repos next to it.
      - name: Checkout SAM_OCCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: SAM_OCCT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compute SAMVersion (H12 provenance stamping)
        id: samver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same convention as SAM_Deploy/installer.yml and the other SAM-BIM repos'
          # build.yml: prefer head_ref when it's a sow branch (release-promotion PRs),
          # else base_ref on PR events / ref_name on push/dispatch events.
          $headRef = '${{ github.head_ref }}'
          $baseRef = '${{ github.base_ref }}'
          $refName = '${{ github.ref_name }}'
          if ($headRef -match '^sow/\d{4}-Q\d$') {
            $ref = $headRef
          } elseif ('${{ github.event_name }}' -eq 'pull_request') {
            $ref = $baseRef
          } else {
            $ref = $refName
          }
          $run = ${{ github.run_number }} % 60000
          if ($ref -match 'sow/(\d{4})-Q(\d)') {
            $v = "$($Matches[1]).$($Matches[2]).$run.0"
            $src = "branch '$ref'"
          } else {
            $now = (Get-Date).ToUniversalTime()
            $quarter = [int][Math]::Ceiling($now.Month / 3.0)
            $v = "$($now.Year).$quarter.$run.0"
            $src = "date $($now.ToString('yyyy-MM-dd')) (ref '$ref' not sow/yyyy-Qx)"
          }
          Write-Host "SAMVersion = $v (from $src)"
          "samversion=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Expose as env vars so MSBuild/dotnet pick them up (property falls back to the
          # process environment variable of the same name) for every subsequent step
          # without threading /p:SAMVersion=... through each invocation individually.
          "SAMVersion=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $sha = (& git -C SAM_OCCT rev-parse --short HEAD 2>$null).Trim()
          if (-not $sha) { $sha = 'unknown' }
          $infoVer = "$v+$sha"
          Write-Host "InformationalVersion = $infoVer"
          "InformationalVersion=$infoVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAMSourceRevision=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clone dependency repos (siblings)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $org   = 'SAM-BIM'
          $token = '${{ secrets.ORG_REPO_TOKEN }}'

          $deps = @(
            'SAM'
            'SAM_Solver'
          )

          # Match the SAM dependency to this repo's line of development. The
          # sow/2026-Q3 SAM branch carries the System.Text.Json migration, so its
          # public API no longer leaks Newtonsoft.Json types into SAM_OCCT (the
          # default branch still does, which breaks the compile with CS0012).
          # Falls back to the default branch if that branch does not exist yet.
          $depBranch = 'sow/2026-Q3'

          foreach ($r in $deps) {
            if (Test-Path $r) { continue }
            # Token URL so private deps (e.g. SAM_Solver) don't prompt for credentials;
            # SAM is public so the bare URL would also work for it.
            $url = if ($token) { "https://$token@github.com/$org/$r.git" } else { "https://github.com/$org/$r.git" }
            Write-Host "Cloning $r @ $depBranch"
            git clone --depth 1 --branch $depBranch $url $r
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Branch '$depBranch' not found for $r; falling back to default branch."
              git clone --depth 1 $url $r
            }
          }

          # Ensure the reference path folder exists even before SAM_Windows builds
          New-Item -ItemType Directory -Force -Path "SAM_Windows\build" | Out-Null

      - name: Restore + Rebuild in order (CI props like SAM_Deploy)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $windowsRef = Join-Path (Get-Location) 'SAM_Windows\build'

          # IMPORTANT: keep these as an ARRAY of args (do NOT join into one string)
          $common = @(
            '/m:1'
            '/nr:false'
            '/v:m'
            '/p:Configuration=Release'
            '/p:UseSharedCompilation=false'
            '/p:RunPostBuildEvent=OnOutputUpdated'
            "/p:ReferencePath=$windowsRef"
            # H12 provenance stamping: explicit even though SAMVersion/InformationalVersion
            # are also exported as env vars (MSBuild properties fall back to the environment) -
            # keeps this step self-documenting and matches the other SAM-BIM repos' convention.
            "/p:SAMVersion=$env:SAMVersion"
            "/p:InformationalVersion=$env:InformationalVersion"
          )

          # If you really want Platform, use this (quoted) line:
          # $common += '/p:Platform="Any CPU"'

          # Keep this repo LAST so its dependencies are built first.
          # SAM_OCCT now references SAM_Solver's SAM.Analytical.Solver (shared SolverQuery.Slits
          # detection + SolverParameter bucket/weight stamping). Build just that project - it pulls
          # SAM.Geometry.Solver/SAM.Core.Solver and emits SAM_Solver\build\SAM.Analytical.Solver.dll -
          # so we avoid the Grasshopper/Rhino projects in SAM_Solver.sln.
          $solutions = @(
            'SAM\SAM.sln'
            'SAM_Solver\SAM_Solver\SAM.Analytical.Solver\SAM.Analytical.Solver.csproj'
            'SAM_OCCT\SAM_OCCT.sln'
          )

          foreach ($sln in $solutions) {
            if (-not (Test-Path $sln)) { throw "Missing solution: $sln" }
            Write-Host "==> Restore: $sln"
            & msbuild $sln /t:Restore @common
          }

          foreach ($sln in $solutions) {
            Write-Host "==> Rebuild: $sln"
            & msbuild $sln /t:Rebuild @common
          }

      - name: Run tests (unit always; integration auto-skips without native)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $unit        = 'SAM_OCCT/Testing/SAM.OCCT.UnitTests/SAM.OCCT.UnitTests.csproj'
          $integration = 'SAM_OCCT/Testing/SAM.OCCT.IntegrationTests/SAM.OCCT.IntegrationTests.csproj'

          # H12 provenance stamping: dotnet test rebuilds the referenced SAM.*.OCCT
          # projects. Without -p:SAMVersion/-p:InformationalVersion here too, that
          # rebuild would recompile them at the local-dev (unstamped) fallback and
          # silently overwrite the CI-stamped Release DLLs the Rebuild step above
          # just produced - shipping version-inconsistent assemblies. The dedicated
          # assertion step below re-checks the final on-disk state for this reason.
          $verArgs = @(
            "-p:SAMVersion=$env:SAMVersion"
            "-p:InformationalVersion=$env:InformationalVersion"
          )

          # Unit tests must pass. Coverage is collected for reporting (soft gate).
          dotnet test $unit `
            -c Release `
            @verArgs `
            --logger "trx;LogFileName=unit.trx" `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults

          # Integration tests run real OCCT; they SkippableFact-skip when the
          # native library is absent, so this step stays green without it.
          dotnet test $integration `
            -c Release `
            @verArgs `
            --logger "trx;LogFileName=integration.trx" `
            --results-directory TestResults

      - name: Assert H12 provenance (FileVersion stamped, AssemblyVersion unchanged)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $samVersion = $env:SAMVersion
          if (-not $samVersion) { throw "SAMVersion env var is not set - the Compute SAMVersion step did not run or failed." }

          # The 8 SAM-owned managed assemblies in scope for H12. Searched recursively (not
          # a fixed build\ path) because one of them - SAM.Core.Grasshopper.OCCT - has a
          # pre-existing, unrelated OutputPath quirk in its .csproj (Release|AnyCPU writes to
          # Grasshopper\build\ instead of the repo-root build\ that every sibling project
          # uses). That is out of scope for H12 (metadata-only FileVersion stamping) and is
          # NOT fixed here; searching recursively keeps this assertion correct regardless of
          # where a project's Release output actually lands.
          $wildcardAssemblies = @(
            'SAM.Analytical.OCCT.dll'
            'SAM.Geometry.OCCT.dll'
            'SAM.Core.Grasshopper.OCCT.dll'
            'SAM.Geometry.Grasshopper.OCCT.dll'
            'SAM.Analytical.Grasshopper.OCCT.dll'
          )
          $unversionedAssemblies = @(
            'SAM.Analytical.OCCT.Solver.dll'
            'SAM.Core.OCCT.dll'
            'SAM.Geometry.OCCT.Solver.dll'
          )

          $failures = @()

          foreach ($name in ($wildcardAssemblies + $unversionedAssemblies)) {
            $match = Get-ChildItem -Path 'SAM_OCCT' -Recurse -Filter $name -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $match) {
              $failures += "$name : not found anywhere under SAM_OCCT\"
              continue
            }

            $fvi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($match.FullName)
            $asmVersion = [System.Reflection.AssemblyName]::GetAssemblyName($match.FullName).Version.ToString()

            Write-Host "$name : FileVersion=$($fvi.FileVersion) ProductVersion=$($fvi.ProductVersion) AssemblyVersion=$asmVersion ($($match.FullName))"

            # H12 criterion: FileVersion must equal SAMVersion for every SAM-owned managed
            # assembly - this is the whole point of the fix.
            if ($fvi.FileVersion -ne $samVersion) {
              $failures += "$name : FileVersion is '$($fvi.FileVersion)', expected '$samVersion'"
            }

            # Safety criterion: AssemblyVersion is explicitly NOT part of H12 and must never
            # be SAMVersion. Exact x/y is build-clock-derived for the 1.0.* wildcard group, so
            # only the un-changed *shape* is asserted, not exact equality across runs.
            if ($asmVersion -eq $samVersion) {
              $failures += "$name : AssemblyVersion was stamped to SAMVersion ('$asmVersion') - AssemblyVersion must never change under H12"
            }
            if ($unversionedAssemblies -contains $name -and $asmVersion -ne '0.0.0.0') {
              $failures += "$name : expected AssemblyVersion 0.0.0.0 (no AssemblyVersion attribute), got '$asmVersion'"
            }
            if ($wildcardAssemblies -contains $name -and $asmVersion -notmatch '^1\.0\.\d+\.\d+$') {
              $failures += "$name : expected AssemblyVersion matching 1.0.x.y (from AssemblyVersion(""1.0.*"")), got '$asmVersion'"
            }
          }

          if ($failures.Count -gt 0) {
            Write-Host "::error::H12 provenance assertion FAILED:"
            $failures | ForEach-Object { Write-Host "::error::  $_" }
            throw "H12 provenance assertion failed for $($failures.Count) check(s) - see errors above."
          }

          Write-Host "H12 provenance assertion PASSED for all 8 SAM-owned managed assemblies (SAMVersion=$samVersion)."

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAM_OCCT-test-results
          path: TestResults/**
          if-no-files-found: warn

      - name: Upload build folders (optional)
        uses: actions/upload-artifact@v4
        with:
          name: SAM_OCCT-build-folders
          path: |
            **\build\*
          if-no-files-found: warn
